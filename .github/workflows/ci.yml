name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The suite spawns a real server; without a cap a hung child burns the
    # default 6h of runner time instead of failing fast.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install from package.json rather than `npm ci`. Tailwind v4 ships its
      # compiler as a per-platform native binary, and npm's optional-dependency
      # resolution (npm/cli#4828) fails to fetch the Linux binary when a lockfile
      # generated on another platform is present. This matches the Dockerfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      # The access-matrix suite needs a Supabase project of its own: it creates
      # and deletes real accounts with service_role privileges. Add these five as
      # repository secrets (Settings → Secrets and variables → Actions) pointing
      # at a project kept for testing, never the one holding real data.
      #
      # Until they exist the step is skipped rather than failed, so the typecheck
      # and build still gate every push. Skipping is visible in the run summary;
      # a red build that everyone learns to ignore is worse than an honest gap.
      - name: Test
        if: ${{ secrets.TEST_DATABASE_URL != '' }}
        run: npm test
        timeout-minutes: 8
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_SUPABASE_JWT_SECRET: ${{ secrets.TEST_SUPABASE_JWT_SECRET }}

      - name: Test (skipped — no Supabase test project configured)
        if: ${{ secrets.TEST_DATABASE_URL == '' }}
        run: |
          echo "::warning title=Access-matrix tests skipped::Set the TEST_SUPABASE_* repository secrets to run the 66 authorization tests."

      - name: Build
        run: npm run build

      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
